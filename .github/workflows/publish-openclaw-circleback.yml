name: Publish OpenClaw Plugin

on:
  push:
    branches: ['main']
    paths:
      - 'package.json'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: 'Production'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npx tsc
      # validate exits 1 on hard errors but 0 on warnings, and has no strict flag
      - name: Validate with ClawHub Plugin Inspector
        run: npx clawhub@^0.23 package validate . --json | jq -e '.summary.warningCount == 0'
      - name: Publish to npm
        run: npx npm@^11.5.1 publish --access public
      - name: Publish to ClawHub
        run: |
          npx clawhub@^0.23 login --token "$CLAWHUB_TOKEN"
          npx clawhub@^0.23 package publish . --owner circleback
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
